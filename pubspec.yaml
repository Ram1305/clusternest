name: clusternest
description: ClusterNest Tenant Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Image Handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  
  # Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  
  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # UI Components
  flutter_svg: ^2.0.9
  flutter_launcher_icons: ^0.13.1
  
  # Notifications
  flutter_local_notifications: ^17.2.1
  
  # Date & Time
  intl: ^0.18.1
  
  # URL Launcher
  url_launcher: ^6.2.2
  
  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0

  # Fonts
  google_fonts: ^6.1.0

  # Payment
  razorpay_flutter: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/clusterappicon.png
    - assets/clusterlogo.png
    - assets/call.svg
    - assets/password.svg
    - assets/login.svg
    - assets/signup.svg
    - assets/adminlogin.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/clusterappicon.png"
